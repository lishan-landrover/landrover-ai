<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Land Rover AI Mechanic & Fault Advisor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a241c; color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: #263329; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #d4af37; text-align: center; }
        p.subtitle { text-align: center; color: #ccc; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, textarea, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        select, textarea { background: #141c16; color: #fff; border: 1px solid #4a5d4e; }
        button { background: #2e7d32; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #1b5e20; }
        #result { margin-top: 25px; padding: 20px; background: #141c16; border-left: 4px solid #d4af37; border-radius: 5px; display: none; line-height: 1.6; white-space: pre-wrap; }
        .affiliate-box { margin-top: 20px; padding: 15px; background: #334236; border-radius: 5px; text-align: center; }
        .affiliate-btn { display: inline-block; background: #d4af37; color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇬🇧 Land Rover AI Mechanic</h1>
        <p class="subtitle">Instant Fault Diagnosis, MOT Advice & UK Repair Cost Estimator</p>
        
        <label for="model">Select Your Land Rover Model:</label>
        <select id="model">
            <option value="Defender (90/110/130)">Defender (90 / 110 / 130)</option>
            <option value="Discovery 3 / 4">Discovery 3 / 4</option>
            <option value="Discovery 5 / Sport">Discovery 5 / Discovery Sport</option>
            <option value="Range Rover (L322 / L405)">Range Rover (Full Size)</option>
            <option value="Range Rover Sport">Range Rover Sport</option>
            <option value="Range Rover Evoque">Range Rover Evoque</option>
            <option value="Freelander 1 / 2">Freelander 1 / 2</option>
        </select>

        <label for="issue">Describe the Problem or Enter Fault Code (OBD2):</label>
        <textarea id="issue" rows="4" placeholder="e.g., Suspension fault amber light on, knocking noise from front left wheel, or P0401 code..."></textarea>

        <button onclick="diagnose()" id="btn">Diagnose Problem Free</button>

        <div id="result"></div>
    </div>

    <script>
        async function diagnose() {
            const model = document.getElementById('model').value;
            const issue = document.getElementById('issue').value;
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('btn');

            if (!issue.trim()) {
                alert("Please describe the issue or enter a fault code.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Diagnosing... Please wait...";
            resultDiv.style.display = "none";

            try {
                const response = await fetch('/api/diagnose', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model, issue })
                });
                const data = await response.json();
                
                const affiliateHTML = `
                    <div class="affiliate-box">
                        <strong>Need Replacement Parts in the UK?</strong><br>
                        Compare genuine & OEM Land Rover parts with fast UK delivery.<br>
                        <a href="https://ebay.co.uk{encodeURIComponent(model)}+parts" target="_blank" class="affiliate-btn">Search Parts on eBay UK ➔</a>
                    </div>
                `;

                resultDiv.innerHTML = data.reply + affiliateHTML;
                resultDiv.style.display = "block";
            } catch (error) {
                alert("Error connecting to AI. Please try again.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Diagnose Problem Free";
            }
        }
    </script>
</body>
</html>
